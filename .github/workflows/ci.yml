name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Une PR qui reçoit un nouveau push annule son run précédent. Sur main, chaque commit a son propre
# groupe et n'est jamais annulé ni remplacé : sans CI verte, un commit n'a pas d'image et ne peut
# pas être release.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    # Le titre de la PR devient le message du squash : il doit suivre Conventional Commits.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            test
            refactor
            infra
            ci

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le nom de la branche
        env:
          BRANCH: ${{ github.head_ref }}
        # Même script que le hook pre-commit local.
        run: bash infra/scripts/check-branch-name.sh "$BRANCH"

  commit-messages:
    # Vérifie chaque commit de la PR, pas seulement le titre.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  python:
    name: python (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, etl, ml]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    # Base TimescaleDB pour les tests qui lisent ou écrivent en base (api, etl)
    services:
      db:
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: enervision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d enervision"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/enervision
      SECRET_KEY: cle-de-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements*.txt
        if: hashFiles(format('{0}/requirements.txt', matrix.component)) != ''
      - name: Installer les dépendances
        if: hashFiles(format('{0}/requirements.txt', matrix.component)) != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Outils de lint et de test figés dans requirements-dev.txt ; sans ce fichier (module qui n'en a pas encore), versions du jour
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install ruff pytest pytest-cov; fi
      - name: Migrations de la base
        if: (matrix.component == 'api' || matrix.component == 'etl') && hashFiles('api/requirements.txt') != ''
        # Venv séparé : les dépendances de l'API ne se mélangent pas à celles du composant testé
        working-directory: api
        run: |
          python -m venv /tmp/migrations
          /tmp/migrations/bin/pip install -q -r requirements.txt
          /tmp/migrations/bin/alembic upgrade head
      - name: Lint (ruff)
        if: hashFiles(format('{0}/requirements.txt', matrix.component)) != ''
        run: ruff check .
      - name: Tests (pytest)
        if: hashFiles(format('{0}/requirements.txt', matrix.component)) != ''
        # code 5 = aucun test collecté : toléré tant que le composant démarre
        run: pytest --cov=. --cov-report=term-missing || [ $? -eq 5 ]

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm ci
      - name: Lint
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run lint --if-present
      - name: Tests unitaires
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm test --if-present
      - name: Build
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run build --if-present

  e2e:
    # Tests Cypress : activés dès que frontend/cypress.config.* existe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/cypress.config.*') != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cypress
        if: hashFiles('frontend/cypress.config.*') != ''
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          build: npm run build
          start: npm run preview
          wait-on: "http://localhost:4173"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (dépendances, secrets, configuration IaC)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0, référence sûre de l'avis CVE-2026-33634
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Point d'entrée unique pour la règle de protection de main :
  # seul ce job est à exiger, quels que soient les composants présents.
  ci-ok:
    if: always()
    needs: [pr-title, branch-name, commit-messages, python, frontend, e2e, security]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les résultats
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"'; then exit 1; fi
