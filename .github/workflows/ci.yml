name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    # Le titre de la PR devient le message du squash : il doit suivre Conventional Commits.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            test
            refactor
            infra
            ci

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le nom de la branche
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # release-please et dependabot créent leurs propres branches
          if [[ "$BRANCH" == release-please--* || "$BRANCH" == dependabot/* ]]; then exit 0; fi
          if [[ ! "$BRANCH" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ || ${#BRANCH} -gt 50 ]]; then
            echo "::error::Nom de branche invalide : '$BRANCH'. Attendu : minuscules et tirets, sans préfixe ni slash, 50 caractères maximum (ex. endpoint-readings)."
            exit 1
          fi

  commit-messages:
    # Vérifie chaque commit de la PR, pas seulement le titre.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  python:
    name: python (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, etl, ml]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements*.txt
        if: hashFiles(format('{0}/requirements.txt', matrix.component)) != ''
      - name: Installer les dépendances
        if: hashFiles(format('{0}/requirements.txt', matrix.component)) != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest pytest-cov
      - name: Lint (ruff)
        if: hashFiles(format('{0}/requirements.txt', matrix.component)) != ''
        run: ruff check .
      - name: Tests (pytest)
        if: hashFiles(format('{0}/requirements.txt', matrix.component)) != ''
        # code 5 = aucun test collecté : toléré tant que le composant démarre
        run: pytest --cov=. --cov-report=term-missing || [ $? -eq 5 ]

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm ci
      - name: Lint
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run lint --if-present
      - name: Tests unitaires
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm test --if-present
      - name: Build
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run build --if-present

  e2e:
    # Tests Cypress : activés dès que frontend/cypress.config.* existe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/cypress.config.*') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cypress
        if: hashFiles('frontend/cypress.config.*') != ''
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          build: npm run build
          start: npm run preview
          wait-on: "http://localhost:4173"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (dépendances, secrets, configuration IaC)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0, référence sûre de l'avis CVE-2026-33634
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Point d'entrée unique pour la règle de protection de main :
  # seul ce job est à exiger, quels que soient les composants présents.
  ci-ok:
    if: always()
    needs: [pr-title, branch-name, commit-messages, python, frontend, e2e, security]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les résultats
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"'; then exit 1; fi
