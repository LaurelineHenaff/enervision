name: Deploiement staging

# Déploie sur la VM de l'école une fois la CI verte sur main.
# Le runner auto-hébergé est dans le réseau de l'école : seul ce workflow l'utilise,
# et il ne se déclenche jamais sur une pull request (dépôt public).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, staging]
    environment: staging
    env:
      COMPOSE_PROJECT_NAME: enervision
      # Secrets des services : fichier présent sur la VM, jamais dans le dépôt.
      ENV_FILE: /etc/enervision/staging.env
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Vérifier les prérequis
        run: |
          test -f docker-compose.yml || { echo "::error::docker-compose.yml absent à la racine"; exit 1; }
          test -f "$ENV_FILE" || { echo "::error::$ENV_FILE absent sur la VM"; exit 1; }

      - name: Déployer les conteneurs
        run: |
          docker compose --env-file "$ENV_FILE" pull --ignore-buildable
          docker compose --env-file "$ENV_FILE" up -d --build --remove-orphans

      - name: Afficher l'état
        run: docker compose --env-file "$ENV_FILE" ps
