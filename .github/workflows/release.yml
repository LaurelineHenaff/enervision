name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Une seule release à la fois, dans l'ordre des merges.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Jeton de la GitHub App (variable RELEASE_APP_ID, secret RELEASE_APP_PRIVATE_KEY) :
      # un tag créé avec ce jeton déclenche les workflows de déploiement sur tag, ce que
      # GITHUB_TOKEN ne fait pas. Sans l'App, repli sur GITHUB_TOKEN.
      - uses: actions/create-github-app-token@v2
        id: app
        if: vars.RELEASE_APP_ID != ''
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculer la version et publier la release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail

          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then last="v0.0.0"; range="HEAD"; else range="$last..HEAD"; fi

          subjects=$(git log "$range" --format='%s')
          bodies=$(git log "$range" --format='%b')

          if [ -z "$subjects" ]; then echo "Aucun commit depuis $last."; exit 0; fi

          # Conventional Commits : `!` ou BREAKING CHANGE = majeure, feat = mineure, fix = correctif.
          if grep -Eq '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" || grep -q 'BREAKING CHANGE' <<<"$bodies"; then bump=major
          elif grep -Eq '^feat(\([^)]*\))?:' <<<"$subjects"; then bump=minor
          elif grep -Eq '^fix(\([^)]*\))?:' <<<"$subjects"; then bump=patch
          else echo "Aucun commit feat ou fix depuis $last : pas de release."; exit 0; fi

          IFS=. read -r major minor patch <<<"${last#v}"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="v${major}.${minor}.${patch}"

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then echo "Le tag $next existe déjà."; exit 0; fi

          echo "Release $next ($bump depuis $last)"
          gh release create "$next" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$next" --generate-notes --latest
